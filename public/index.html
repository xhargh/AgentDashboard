<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111416">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" href="/icons/favicon-16x16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/icons/favicon-32x32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/icons/site.webmanifest">
  <title>AgentDashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to dashboard</a>
  <header class="app-header">
    <div class="header-inner">
      <div class="wordmark"><img class="brand" src="/icons/icon.svg" alt=""><strong>AgentDashboard</strong><span class="workspace-label">Workspace</span></div>
      <span id="connection" role="status">Connecting…</span>
    </div>
  </header>
  <main id="main">
    <section class="intro">
      <h1>Overview</h1>
      <button id="logout" class="secondary-button" hidden>Disconnect</button>
    </section>
    <form id="login" hidden>
      <h2>Connect to companion</h2>
      <label for="token">Companion access token</label>
      <div class="row"><input id="token" type="password" required autocomplete="off" placeholder="Paste your AgentDashboard access token"><button>Connect</button></div>
      <p class="login-help muted">The token stays in memory for this tab. Reports refresh every two seconds.</p>
      <p id="error" role="alert"></p>
    </form>
    <div id="dashboard" hidden>
      <section id="metrics" class="metrics" aria-label="Agent totals"></section>
      <section class="fleet-controls" aria-label="Fleet controls">
        <div class="fleet-toolbar">
          <div class="fleet-title"><h2 class="fleet-heading">Agents</h2><span class="live-label"><span aria-hidden="true"></span>Live activity</span></div>
          <div class="sort-controls">
            <label for="session-sort">Sort by<select id="session-sort" aria-label="Sort sessions"><option value="activity">Recent activity</option><option value="status">Status</option><option value="context">Current context tokens</option><option value="tokens">Cumulative tokens</option><option value="name">Session name</option></select></label>
            <button id="sort-direction" class="secondary-button" type="button" aria-label="Sort direction">↓</button>
          </div>
          <label class="search-field" for="search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span class="sr-only">Search</span><input id="search" type="search" placeholder="Search agents, tasks, folders…"></label>
        </div>
        <details class="filters">
          <summary><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5"/><circle cx="15" cy="17" r="2.5"/></svg>Filter agents</summary>
          <div class="filter-panel">
            <div class="filter-fields"><label id="computer-filter" for="host">Computer<select id="host"><option value="">All computers</option></select></label></div>
            <div class="filter-options">
              <label class="filter-option" for="active"><input type="checkbox" id="active" aria-describedby="active-help"><span><strong>Active only</strong><small id="active-help">Working agents, permission waits, errors, and parents with child attention.</small></span></label>
              <label class="filter-option" for="hide-finished"><input type="checkbox" id="hide-finished" checked aria-describedby="finished-help"><span><strong>Hide finished subagents</strong><small id="finished-help">Hide idle subagents until they resume. Main agents stay visible.</small></span></label>
              <label class="filter-option" for="hide-waiting"><input type="checkbox" id="hide-waiting" aria-describedby="waiting-help"><span><strong>Hide agents waiting for input</strong><small id="waiting-help">Hide idle main agents until you send them another message.</small></span></label>
              <label class="filter-option" for="hide-offline"><input type="checkbox" id="hide-offline" checked aria-describedby="offline-help"><span><strong>Hide offline agents</strong><small id="offline-help">Hide instances that have stopped reporting to the companion.</small></span></label>
              <label class="filter-option" for="notifications"><input type="checkbox" id="notifications" aria-describedby="notifications-help"><span><strong>Attention notifications</strong><small id="notifications-help">Browser notifications for new permission requests and errors. Permission is requested when enabled.</small></span></label>
              <label class="filter-option" for="tab-count"><input type="checkbox" id="tab-count"><span><strong>Attention count in tab title</strong><small>See outstanding requests even when this tab is in the background.</small></span></label>
              <label class="filter-option" for="session-log-enabled"><input type="checkbox" id="session-log-enabled"><span><strong>Enable on-demand session logs</strong><small>Requires separate plugin opt-in, access key and explicit expansion before any transcript is fetched.</small></span></label>
              <label class="filter-option" for="tool-details-enabled"><input type="checkbox" id="tool-details-enabled"><span><strong>Enable safe tool details</strong><small>Requires plugin opt-in, Tool activity and an explicit per-call reveal; raw inputs/results are never transmitted.</small></span></label>
              <label class="filter-option session-log-key-option" for="session-log-token"><span><strong>Session log access key</strong><small>Held in memory only; never saved in local storage.</small></span><input id="session-log-token" type="password" autocomplete="off" placeholder="Optional separate transcript key"></label>
            </div>
          </div>
        </details>
      </section>
      <div id="fleet" aria-label="Agent activity"></div>
    </div>
  </main>
  <footer><span>AgentDashboard <span class="footer-separator">/</span> Read-only monitoring</span><span><a href="https://github.com/xhargh/AgentDashboard">GitHub repository</a></span><span>Offline after 20 seconds without a heartbeat</span></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
