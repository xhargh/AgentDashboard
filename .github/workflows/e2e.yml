name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test environment
        run: docker build --tag opencode-supervisor-ci .
      - name: Run browser tests
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          --env CI=1
          opencode-supervisor-ci
